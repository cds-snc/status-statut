name: Workflow failure

on:
  workflow_run:
    workflows:
      - "Graphs CI"
      - "Response Time CI"
      - "Static Site CI"
      - "Summary CI"
      - "Terraform apply"
      - "Update Template CI"
      - "Uptime CI"
    types:
      - completed

jobs:
  on-failure:
    runs-on: ubuntu-latest
    # Uptime CI alerts only on conclusions that are never transient; every other
    # workflow also alerts on `failure` and `timed_out`. See MAINTENANCE.md §5.
    if: >-
      github.event.workflow.name != 'Workflow failure'
      && (
        contains(fromJSON('["action_required","startup_failure"]'), github.event.workflow_run.conclusion)
        || (github.event.workflow.name != 'Uptime CI'
            && contains(fromJSON('["failure","timed_out"]'), github.event.workflow_run.conclusion))
      )
    steps:
      - name: Notify Slack
        run: |
          json='{"blocks":[{"type":"section","text":{"type":"mrkdwn","text":":red: Status page workflow did not succeed (`${{ github.event.workflow_run.conclusion }}`): <${{ github.event.workflow_run.html_url }}|${{ github.event.workflow.name }}>"}}]}'
          curl -X POST -H 'Content-type: application/json' --data "$json" ${{ secrets.STATUS_OPS_WEBHOOK }}
