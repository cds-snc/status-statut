name: Workflow failure

on:
  workflow_run:
    workflows:
      - "Graphs CI"
      - "Response Time CI"
      - "Static Site CI"
      - "Summary CI"
      - "Terraform apply"
      - "Update Template CI"
      - "Uptime CI"
    types:
      - completed

jobs:
  on-failure:
    runs-on: ubuntu-latest
    # `action_required` means GitHub froze the run pending approval (e.g. its
    # malicious-workflow scanner). Scheduled runs have nobody to approve them, so
    # they expire silently — it is not a `failure` and nothing else reports it.
    if: >-
      contains(fromJSON('["failure","action_required","timed_out","startup_failure"]'), github.event.workflow_run.conclusion)
      && github.event.workflow.name != 'Workflow failure'
    steps:
      - name: Notify Slack
        run: |
          json='{"blocks":[{"type":"section","text":{"type":"mrkdwn","text":":red: Status page workflow did not succeed (`${{ github.event.workflow_run.conclusion }}`): <${{ github.event.workflow_run.html_url }}|${{ github.event.workflow.name }}>"}}]}'
          curl -X POST -H 'Content-type: application/json' --data "$json" ${{ secrets.STATUS_OPS_WEBHOOK }}
