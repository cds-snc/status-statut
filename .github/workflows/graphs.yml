# Originally generated by upptime/uptime-monitor, then modified on purpose.
# Upstream's "do not edit" banner does not apply — see MAINTENANCE.md §6.
# Most settings belong in .upptimerc.yml: https://upptime.js.org/docs

name: Graphs CI
on:
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
    types: [graphs]
  workflow_dispatch:
jobs:
  release:
    name: Generate graphs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate graphs
        uses: upptime/uptime-monitor@5811f280953e960b7667f0031a4d326f5f97ba99 # v1.45.0
        with:
          command: "graphs"
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
