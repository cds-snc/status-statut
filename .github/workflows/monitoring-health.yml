# Daily canary for the monitoring itself.
#
# Per-run alerting (workflow-failure.yml) cannot see the failure mode that cost us
# eight weeks of history in 2026: workflows that report `success` while recording
# nothing, and scheduled runs frozen as `action_required` (a *completed* conclusion
# that GitHub surfaces nowhere). This checks the outcome instead of the runs.
#
# See MAINTENANCE.md §5.

name: Monitoring health

on:
  schedule:
    - cron: "30 12 * * *" # after the 23:00 → 01:00 UTC data cycle
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  canary:
    name: Check that monitoring is producing data
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      MAX_HISTORY_AGE_HOURS: "25"
      MIN_UPTIME_SUCCESS_PCT: "40"
    steps:
      - name: Evaluate
        id: check
        run: |
          set -uo pipefail
          problems=()

          # 1. Is data still landing? Response Time CI commits every site daily.
          last=$(gh api "repos/$REPO/commits?path=history&per_page=1" \
                   --jq '.[0].commit.committer.date')
          last_epoch=$(date -u -d "$last" +%s 2>/dev/null || echo "")
          if [ -z "$last_epoch" ]; then
            echo "::warning::Could not read the last history/ commit date; skipping that check."
          else
            age_h=$(( ( $(date -u +%s) - last_epoch ) / 3600 ))
            echo "Last history/ commit: $last (${age_h}h ago)"
            if [ "$age_h" -gt "$MAX_HISTORY_AGE_HOURS" ]; then
              problems+=("No commit to \`history/\` in ${age_h}h — status data is stale and graphs will gap.")
            fi
          fi

          # 2. Are the 5-minute probes actually running?
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          runs() {
            gh api "repos/$REPO/actions/workflows/uptime.yml/runs?created=>$since&per_page=1${1:-}" \
              --jq '.total_count'
          }
          total=$(runs); ok=$(runs "&status=success"); blocked=$(runs "&status=action_required")
          # A failed API call must not silently read as "zero runs".
          case "${total}${ok}${blocked}" in
            *[!0-9]*|"")
              echo "::warning::Could not read Uptime CI run counts from the API; skipping that check."
              total=-1 ;;
          esac
          echo "Uptime CI over 24h: total=$total success=$ok action_required=$blocked"

          if [ "$total" -ge 0 ]; then
            if [ "$blocked" -gt 0 ]; then
              problems+=("${blocked} Uptime CI run(s) frozen as \`action_required\` — GitHub is holding the workflow for approval and scheduled runs cannot self-approve.")
            fi
            if [ "$total" -eq 0 ]; then
              problems+=("No Uptime CI runs in 24h — the schedule has stopped firing.")
            else
              pct=$(( ok * 100 / total ))
              echo "Success rate: ${pct}%"
              if [ "$pct" -lt "$MIN_UPTIME_SUCCESS_PCT" ]; then
                problems+=("Uptime CI success rate ${pct}% over 24h (threshold ${MIN_UPTIME_SUCCESS_PCT}%).")
              fi
            fi
          fi

          if [ ${#problems[@]} -eq 0 ]; then
            echo "Monitoring is healthy."
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            printf 'UNHEALTHY:\n'; printf ' - %s\n' "${problems[@]}"
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            { echo "report<<EOF"; printf '• %s\n' "${problems[@]}"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack
        if: steps.check.outputs.healthy == 'false'
        env:
          REPORT: ${{ steps.check.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEBHOOK: ${{ secrets.STATUS_OPS_WEBHOOK }}
        run: |
          set -euo pipefail
          text=$(printf ':red: Status page monitoring is not producing data:\n%s\n<%s|Monitoring health run>' \
                   "$REPORT" "$RUN_URL")
          jq -nc --arg t "$text" \
            '{blocks:[{type:"section",text:{type:"mrkdwn",text:$t}}]}' \
          | curl -sS -X POST -H 'Content-type: application/json' --data @- "$WEBHOOK"

      - name: Fail the run if unhealthy
        if: steps.check.outputs.healthy == 'false'
        run: exit 1
