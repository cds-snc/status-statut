# Originally generated by upptime/uptime-monitor@v1.27.0, then modified on purpose.
#
# Upstream's banner says this file is regenerated daily and must not be edited.
# That is not true here: the workflow that regenerated it was removed (#487), and
# the `update-template` step that would rewrite it is deliberately absent (below).
#
# Most settings still belong in .upptimerc.yml: https://upptime.js.org/docs
# See MAINTENANCE.md for what is customised here and why.

name: Setup CI
on:
  push:
    paths:
      - ".upptimerc.yml"
  repository_dispatch:
    types: [setup]
  workflow_dispatch:
jobs:
  release:
    name: Setup Upptime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      # NOTE: upstream's `update-template` step is intentionally omitted.
      #
      # It regenerates all Upptime workflow files from upstream templates and
      # prunes api/, graphs/ and history/ of any site no longer in .upptimerc.yml.
      # Here that would un-pin every action SHA, drop the CodeBuild runner label,
      # recreate workflows we deleted, and irreversibly delete the history of
      # ~20 retired services. It also requires a token with `workflows` write,
      # which GITHUB_TOKEN does not have and our org's PAT policy forbids.
      #
      # Do not re-add it. See MAINTENANCE.md §6.
      - name: Update response time
        uses: upptime/uptime-monitor@2e53e7570ad597ccf3f251d43502846a042165d2 # v1.44.0
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
          CANADALOGIN_HEADER: ${{ secrets.CANADALOGIN_HEADER }}
          NOTIFICATION_SLACK: ${{ secrets.NOTIFICATION_SLACK }}
          NOTIFICATION_SLACK_STRATEGY: ${{ secrets.NOTIFICATION_SLACK_STRATEGY }}
          NOTIFICATION_SLACK_WEBHOOK_URL: ${{ secrets.NOTIFICATION_SLACK_WEBHOOK_URL }}
          SUPERSET_HEADER: ${{ secrets.SUPERSET_HEADER }}
      - name: Update summary in README
        uses: upptime/uptime-monitor@2e53e7570ad597ccf3f251d43502846a042165d2 # v1.44.0
        with:
          command: "readme"
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate graphs
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          workflow: Graphs CI
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate site
        uses: upptime/uptime-monitor@2e53e7570ad597ccf3f251d43502846a042165d2 # v1.44.0
        with:
          command: "site"
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        name: GitHub Pages Deploy
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: "site/status-page/__sapper__/export/"
          user_name: "Upptime Bot"
          user_email: "73812536+upptime-bot@users.noreply.github.com"
