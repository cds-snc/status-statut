# Originally generated by upptime/uptime-monitor, then modified on purpose.
# Upstream's "do not edit" banner does not apply — see MAINTENANCE.md §6.
# Most settings belong in .upptimerc.yml: https://upptime.js.org/docs

name: Summary CI
on:
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
    types: [summary]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime-data
  cancel-in-progress: false
jobs:
  release:
    name: Generate README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update summary in README
        uses: upptime/uptime-monitor@2e53e7570ad597ccf3f251d43502846a042165d2 # v1.44.0
        with:
          command: "readme"
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
